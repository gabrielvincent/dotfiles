# Extra autostart processes
# exec-once = uwsm app -- my-service

exec-once = ~/.config/hypr/scripts/auto-kb-layout.sh
exec-once = hyprshell run
exec-once = megasync
exec-once = /usr/bin/hyprland-monitor-attached ~/.config/hypr/scripts/on_monitor_attach.sh ~/.config/hypr/scripts/on_monitor_detach.sh

# Auto-restart swayosd-server when it crashes (known GTK4/Wayland segfault bug)
exec-once = ~/.config/hypr/scripts/swayosd-keepalive.sh
