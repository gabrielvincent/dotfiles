# wl-kbptr hotkeys
unbind = SUPER ALT, F
bindd = SUPER ALT, F, Mouse hints (floating), exec, wl-kbptr -o modes=floating,click
bindd = SUPER ALT, X, Mouse hints (tile), exec, wl-kbptr -o modes=tile,click

bind = SUPER ALT, C, submap, cursor

# Cursor submap (similar to the Mouse mode in Sway)
submap = cursor

# Jump cursor to a position
bind=,x,exec,hyprctl dispatch submap reset && wl-kbptr && hyprctl dispatch submap cursor

# Cursor movement (normal speed)
binde=,j,exec,wlrctl pointer move 0 25
binde=,k,exec,wlrctl pointer move 0 -25
binde=,l,exec,wlrctl pointer move 25 0
binde=,h,exec,wlrctl pointer move -25 0

# Cursor movement (fast speed with Shift)
binde=SHIFT,j,exec,wlrctl pointer move 0 100
binde=SHIFT,k,exec,wlrctl pointer move 0 -100
binde=SHIFT,l,exec,wlrctl pointer move 100 0
binde=SHIFT,h,exec,wlrctl pointer move -100 0

# Left button
bind=,a,exec,wlrctl pointer click left
# Middle button
bind=,s,exec,wlrctl pointer click middle
# Right button
bind=,d,exec,wlrctl pointer click right

# Scroll up and down
binde=,d,exec,wlrctl pointer scroll 10 0
binde=,u,exec,wlrctl pointer scroll -10 0

# Scroll left and right
binde=,t,exec,wlrctl pointer scroll 0 -10
binde=,g,exec,wlrctl pointer scroll 0 10

# Exit cursor submap
bind=,escape,exec,hyprctl keyword cursor:inactive_timeout 3; hyprctl keyword cursor:hide_on_key_press true; hyprctl dispatch submap reset 

bind = , escape, submap, reset

submap = reset
